{{ define "main" }}
<div class="container">
  <article class="thought-post">
    <header class="post-header">
      <h1>{{ .Title }}</h1>
      <div class="post-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
        {{ with .Params.tags }}
          <div class="tags">
            {{ range . }}<span class="tag">#{{ . }} </span>{{ end }}
          </div>
        {{ end }}
      </div>
    </header>

    <div class="post-content">
      {{ .Content }}
    </div>

    <a href="/thoughts/" class="back-link">← Back to all thoughts</a>
  </article>
</div>
{{ end }}
