{{ define "main" }}
<div class="container">
  <div class="section-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="section-description">{{ . }}</p>{{ end }}
  </div>

  <div class="projects-grid">
    {{ range .Pages }}
      {{ partial "project-tile.html" . }}
    {{ end }}
  </div>
</div>

<style>{{ partial "project-styles.css" . }}</style>
{{ end }}
